services:
  mockhub:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_OPTIONS=--max-old-space-size=512
    container_name: mockhub
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=data/mock.db
      - CORS_ORIGIN=*
      - LOG_LEVEL=info
    volumes:
      - mockhub-data:/app/data
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0

volumes:
  mockhub-data:
